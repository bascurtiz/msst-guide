# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration for the MSST Guide.
#
# Every field below maps onto a key in content/pages/*.json, which
# tools/build.mjs renders into the pages. The `key` fields are hidden on
# purpose: they are how a block in the editor is matched to its slot in the
# template, so they must not change.

backend:
  name: github
  # The repository that holds this site, as owner/repo. Every save the author
  # makes is a commit to this repository.
  repo: bascurtiz/msst-guide
  branch: main
  # The OAuth client that gives the author a "Sign in with GitHub" button instead
  # of a pasted personal access token. Deploy Sveltia's authenticator Worker
  # (SETUP.md §3), then set this to its URL — no trailing slash, the editor
  # appends `/auth` and the OAuth app's callback is `/callback` — and delete the
  # leading `#`. Until then leave it commented out and sign in with a token
  # instead: an unconfigured button falls back to Netlify's OAuth client, which
  # knows nothing about this site, so it is the comment that keeps the sign-in
  # screen honest.
  base_url: https://sveltia-cms-auth.multimedia.workers.dev

  # How much the sign-in asks GitHub for on the author's behalf. The Worker's own
  # default is `repo,user`, which GitHub presents to the signer as *full control of
  # private repositories* — far more than one public repository needs. This narrows
  # it to public repositories; the editor appends `user` itself, so the request it
  # actually makes is `public_repo,user`. It accepts exactly one of two values,
  # `repo` or `public_repo` — anything else and the editor refuses to load rather
  # than quietly widening what it asks for. If this repository ever becomes private,
  # change it to `repo`. See SETUP.md §3.
  auth_scope: public_repo
  commit_messages:
    update: "content: edit {{collection}} {{slug}}"

# Images the editor inserts are committed here and served from /assets/uploads.
media_folder: assets/uploads
public_folder: /assets/uploads

site_url: https://msst-guide.pages.dev/
display_url: https://msst-guide.pages.dev/
logo_url: https://msst-guide.pages.dev/assets/img/favicon.svg

# The rendered pages live at the repository root; there is no page preview to
# open mid-edit, and a stale one would be misleading.
editor:
  preview: false

collections:
  - name: pages
    label: Chapters
    label_singular: Chapter
    description: >-
      The text of the guide. Saving commits the change; the site rebuilds
      itself from it a minute later.
    folder: content/pages
    format: json
    extension: json
    create: false
    delete: false
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { name: page, widget: hidden }
      - { name: source, widget: hidden }
      - name: title
        label: Chapter name
        widget: string
        hint: Only used to organise this editor screen. The page's own heading is edited below.
      - name: sections
        label: Sections
        label_singular: Section
        widget: list
        collapsed: true
        summary: "{{fields.label}}"
        hint: One per chapter heading on the page, in the order they appear.
        fields:
          - { name: id, widget: hidden }
          - name: label
            label: Section
            widget: string
            hint: A name for this section in the editor only — it is not shown on the site.
          - name: heading
            label: Heading
            widget: object
            required: false
            fields:
              - { name: key, widget: hidden }
              - { name: label, widget: hidden }
              - name: md
                label: Heading text
                widget: richtext
                modes: [rich_text, raw]
                buttons: [bold, italic, code]
                hint: >-
                  The chapter heading. Inline formatting only — **bold**,
                  *italic*, `code`. Lists, tables and code blocks belong in the
                  Text fields below, which have room to render them.
          - name: blocks
            label: Text
            label_singular: Block
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            hint: >-
              Every paragraph, list item, sub-heading and label in this section,
              in the order they appear on the page.
            fields:
              - { name: key, widget: hidden }
              - name: label
                label: Where this is on the page
                widget: string
                hint: For your orientation in this list — not shown on the site.
              - name: md
                label: Text
                widget: richtext
                modes: [rich_text, raw]
                hint: >-
                  **bold**, *italic*, `code`, [links](https://example.com).
                  The raw mode (the `M↓` button) takes more than the toolbar
                  shows: `- item` and `1. item` for lists, `> quote`, a row of
                  ``` for a code block, and `| a | b |` under a `|---|---|`
                  row for a table. Leave the occasional raw HTML tag (like
                  <i>+</i>) alone — or switch to raw mode to edit it.
          - name: codes
            label: Code
            label_singular: Code block
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            hint: >-
              The command, config and error blocks in this section, in the order
              they appear. Each one holds its own markup: the coloured <span>
              wrappers are what give it its syntax highlighting, so change the
              words and leave the tags alone.
            fields:
              - { name: key, widget: hidden }
              - name: label
                label: Where this is on the page
                widget: string
                hint: For your orientation in this list — not shown on the site.
              - name: code
                label: Code
                widget: code
                output_code_only: true
                allow_language_selection: false
                hint: >-
                  The whole block, its <pre> tag included — everything between
                  the tags reaches the page exactly as typed, indentation and
                  all.
